[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "lyznet"
dynamic = ["version"]
description = "Analysis, learning, and verification of dynamical systems"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    {name = "Jun Liu", email = "23146644+j49liu@users.noreply.github.com"},
]
dependencies = [
    "numpy>=1.26",
    "sympy>=1.12",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/lyznet/lyznet"
Issues = "https://github.com/lyznet/lyznet/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "node-and-date"
fallback_version = "0.1.0.dev0"

[tool.pytest.ini_options]
testpaths = ["tests"]
