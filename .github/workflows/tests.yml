name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test,z3,dreal,plot]"
      - name: Run tests
        run: python -m pytest

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and inspect distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Install and smoke-test the wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl z3-solver
          python -m pip check
          cd /tmp
          python "$GITHUB_WORKSPACE/tools/release_smoke.py"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
